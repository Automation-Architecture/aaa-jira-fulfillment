<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Signing you in…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f9f7f2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #004d43;
      }
      .box { text-align: center; }
      .spin {
        width: 28px;
        height: 28px;
        border: 3px solid #d8d8d8;
        border-top-color: #004d43;
        border-radius: 50%;
        margin: 0 auto 14px;
        animation: r 0.8s linear infinite;
      }
      @keyframes r { to { transform: rotate(360deg); } }
      a { color: #004d43; }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spin"></div>
      <div id="msg">Signing you in…</div>
    </div>
    <script type="module">
      import { loadClerk } from "/auth/clerk-client.js";

      const params = new URLSearchParams(location.search);
      function fail() {
        location.replace("/login?error=auth");
      }

      if (params.get("error")) {
        fail();
      } else {
        try {
          const clerk = await loadClerk();
          if (clerk.isSignedIn) {
            location.replace("/");
          } else {
            // Ticket / handshake may still be settling; give Clerk a moment.
            const started = Date.now();
            const timer = setInterval(() => {
              if (clerk.isSignedIn) {
                clearInterval(timer);
                location.replace("/");
              } else if (Date.now() - started > 8000) {
                clearInterval(timer);
                fail();
              }
            }, 250);
          }
        } catch {
          fail();
        }
      }
    </script>
  </body>
</html>
